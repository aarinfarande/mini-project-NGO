<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NGO Project Management Platform</title>
  <meta name="description" content="NGO project management, field operations, and community impact dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { heading: ['Gelasio','Georgia','serif'], body: ['Inter','sans-serif'] } } } };
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root { color-scheme: light; }
    body { font-family: Inter, sans-serif; background:#FFF9F2; color:#292524; }
    .heading { font-family: Gelasio, Georgia, serif; }
    .fade { animation: fade .18s ease-out; }
    @keyframes fade { from { opacity:0; transform:translateY(4px) } to { opacity:1; transform:translateY(0) } }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid #F9B233; outline-offset:2px; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"><div class="min-h-screen flex items-center justify-center">Loading NGO Workspace…</div></div>
  <script type="text/babel">
    const {useState, useMemo, useEffect} = React;
    const projectsSeed = [
      {id:'p1',title:'Clean Water Initiative',category:'Water & Sanitation',location:'Barmer & Jaisalmer, Rajasthan',progress:65,budget:360000,spent:234000,lead:'Anita Roy',beneficiaries:'6,200 villagers',status:'Active',nextMilestone:'Commission solar filtration pump in Hamlet 4',description:'Borewell drilling, solar filtration installation, and village water user committee training.'},
      {id:'p2',title:'Schools for All',category:'Primary Education',location:'Dhar & Jhabua, Madhya Pradesh',progress:40,budget:480000,spent:192000,lead:'Rahul Verma',beneficiaries:'4,800 students',status:'Active',nextMilestone:'Deliver smartboard kits to Model Upper Primary School',description:'Digital classroom smartboards, STEM laboratory kits, and teacher training.'},
      {id:'p3',title:'Mobile Health Clinic',category:'Healthcare Access',location:'Gadchiroli & Nandurbar, Maharashtra',progress:100,budget:240000,spent:240000,lead:'Dr. Kavita Rao',beneficiaries:'7,400 patients',status:'Completed',nextMilestone:'Handover complete to district healthcare office',description:'Telemedicine van deployment, maternal healthcare camps, and diagnostic screenings.'}
    ];
    const tasksSeed = [
      {id:'t1',title:'Inspect pipeline laying in Jaisalmer cluster 3',project:'Clean Water Initiative',assignee:'Anita Roy',role:'Project Manager',status:'in-progress',priority:'High',dueDate:'Oct 24, 2026'},
      {id:'t2',title:'Conduct parent-teacher digital awareness session',project:'Schools for All',assignee:'Rahul Verma',role:'Project Manager',status:'in-progress',priority:'Medium',dueDate:'Oct 25, 2026'},
      {id:'t3',title:'Verify vendor invoice for smartboard hardware',project:'Schools for All',assignee:'Meena Solanki',role:'Coordinator',status:'review',priority:'Medium',dueDate:'Oct 26, 2026'},
      {id:'t4',title:'Publish Phase 1 telemedicine diagnostic report',project:'Mobile Health Clinic',assignee:'Dr. Kavita Rao',role:'Project Manager',status:'completed',priority:'Normal',dueDate:'Oct 20, 2026'}
    ];
    const fieldSeed = [
      {id:'f1',author:'Suresh Kumar',role:'Coordinator',location:'Barmer Block 2',timestamp:'Today, 04:30 PM',text:'Borewell yield verified at 42 LPM. Clean water sample stored for lab testing.',badge:'Water Lab Verified'},
      {id:'f2',author:'Meena Solanki',role:'Coordinator',location:'Dhar Primary School',timestamp:'Today, 02:15 PM',text:'Students completed the first interactive science module on solar energy.',badge:'48 Beneficiaries'}
    ];
    const roleInfo = {
      admin:{name:'Administrator',subtitle:'Executive portfolio oversight and governance',action:'+ New Task'},
      pm:{name:'Project Manager',subtitle:'Assigned project execution and resource allocation',action:'+ Assign Task'},
      coordinator:{name:'Project Coordinator',subtitle:'Field activity tracking and milestone validation',action:'Submit Field Update'}
    };
    const money = n => '₹' + Number(n).toLocaleString('en-IN');
    function App() {
      const [screen,setScreen] = useState('login');
      const [role,setRole] = useState('admin');
      const [tab,setTab] = useState('dashboard');
      const [projects,setProjects] = useState(projectsSeed);
      const [tasks,setTasks] = useState(tasksSeed);
      const [updates,setUpdates] = useState(fieldSeed);
      const [filter,setFilter] = useState('all');
      const [modal,setModal] = useState('');
      const [toast,setToast] = useState('');
      useEffect(() => { if(!toast) return; const id=setTimeout(()=>setToast(''),2800); return ()=>clearTimeout(id); },[toast]);
      const notify = message => setToast(message);
      const completed = tasks.filter(t=>t.status==='completed').length;
      const activeProjects = projects.filter(p=>p.progress<100).length;
      const filteredTasks = useMemo(()=>tasks.filter(t=>filter==='all'||t.status===filter),[tasks,filter]);
      function signOut(){setScreen('login');setRole('admin');setTab('dashboard');setModal('');}
      function toggleTask(id){setTasks(old=>old.map(t=>t.id===id?{...t,status:t.status==='completed'?'in-progress':'completed'}:t));notify('Task status updated');}
      function updateProgress(id,value){const progress=Math.max(0,Math.min(100,Number(value)));setProjects(old=>old.map(p=>p.id===id?{...p,progress,status:progress===100?'Completed':'Active'}:p));notify('Project progress updated');}
      function submitTask(e){
        e.preventDefault(); const f=e.currentTarget;
        setTasks(old=>[{id:'t'+Date.now(),title:f.title.value,project:f.project.value,assignee:f.assignee.value,role:f.assigneeRole.value,status:'in-progress',priority:f.priority.value,dueDate:f.dueDate.value},...old]);
        setModal('');notify('Task created successfully');
      }
      function submitUpdate(e){
        e.preventDefault(); const f=e.currentTarget;
        setUpdates(old=>[{id:'f'+Date.now(),author:f.author.value,role,location:f.location.value,timestamp:'Just now',text:f.notes.value,badge:f.badge.value||'Field Update'},...old]);
        setModal('');notify('Field update submitted');
      }
      const button = "rounded-xl px-4 py-2.5 text-sm font-semibold transition hover:opacity-90 focus-visible:outline";
      const primary = button+" bg-[#F47B20] text-white";
      const secondary = button+" border border-[#E5DDD3] bg-white text-[#292524]";
      return <div className="min-h-screen">
        {screen==='login' && <div className="min-h-screen flex items-center justify-center p-4 fade">
          <div className="w-full max-w-5xl bg-white rounded-3xl overflow-hidden shadow-xl border border-[#F9B233]/50 grid md:grid-cols-[3fr_2fr]">
            <section className="p-8 sm:p-12 md:p-16">
              <p className="text-xs uppercase tracking-[.2em] text-[#6B625A] font-semibold">NGO Management Workspace</p>
              <h1 className="heading text-5xl font-semibold mt-3">Namaste</h1>
              <p className="text-sm text-[#6B625A] mt-2 mb-8">Sign in to continue to your organization workspace.</p>
              <form className="space-y-5" onSubmit={e=>{e.preventDefault();setScreen('roles')}}>
                <label className="block text-sm font-medium">Email or username<input required type="email" defaultValue="admin@grassroots.ngo" className="mt-2 w-full rounded-xl border border-[#E5DDD3] bg-[#F8F6F2] px-4 py-3"/></label>
                <label className="block text-sm font-medium">Password<input required type="password" defaultValue="demopassword" className="mt-2 w-full rounded-xl border border-[#E5DDD3] bg-[#F8F6F2] px-4 py-3"/></label>
                <div className="flex justify-between text-sm"><button type="button" onClick={()=>setModal('help')} className="underline">Help</button><button type="button" onClick={()=>setModal('forgot')} className="underline">Forgot password?</button></div>
                <button className={primary+" w-full"} type="submit">Sign In →</button>
                <p className="text-xs text-[#6B625A]">Demo only: this form does not authenticate credentials.</p>
              </form>
            </section>
            <aside className="bg-[#F9B233] p-8 sm:p-12 flex flex-col justify-between text-white min-h-64">
              <div><span className="text-xs uppercase tracking-widest font-semibold">Field & Portfolio Engine</span><h2 className="heading text-3xl font-semibold mt-5">Turn grassroots effort into measurable change.</h2><p className="mt-4 text-sm leading-6">A unified workspace for field workers, project leads, and executive oversight.</p></div>
              <p className="text-xs border-t border-white/40 pt-4 mt-8">NGO Suite · Demonstration Workspace</p>
            </aside>
          </div>
        </div>}
        {screen==='roles' && <div className="min-h-screen flex items-center justify-center p-4 fade">
          <div className="w-full max-w-4xl bg-white rounded-3xl shadow-xl overflow-hidden grid md:grid-cols-[3fr_2fr]">
            <section className="p-8 sm:p-12"><p className="text-xs tracking-widest font-bold text-[#6B625A]">WELCOME BACK</p><h1 className="heading text-3xl font-semibold mt-2">Choose your workspace</h1><p className="text-sm text-[#6B625A] mt-2 mb-7">Select a demonstration role to open the dashboard.</p>
              {Object.entries({admin:'Administrator',pm:'Project Manager',coordinator:'Coordinator'}).map(([key,name])=><button key={key} onClick={()=>{setRole(key);setScreen('app');setTab('dashboard');notify(name+' workspace opened')}} className="block w-full text-left p-5 mb-3 rounded-2xl border border-[#E5DDD3] hover:border-[#F47B20] hover:bg-[#FFF9F2]"><span className="font-semibold">{name}</span><span className="block text-xs text-[#6B625A] mt-1">{key==='admin'?'Portfolio oversight and all projects':key==='pm'?'Project execution and task assignments':'Field tasks and progress updates'}</span></button>)}
              <button className="text-sm underline mt-3" onClick={()=>setScreen('login')}>← Back to login</button>
            </section><aside className="bg-[#F9B233] text-white p-8 sm:p-12 flex flex-col justify-between"><div><p className="text-xs uppercase tracking-widest">Our shared mission</p><h2 className="heading text-4xl mt-5">Make every effort count.</h2><p className="mt-4 text-sm">A clear, shared workspace for measurable community impact.</p></div><p className="text-xs mt-8">Empowering communities</p></aside>
          </div>
        </div>}
        {screen==='app' && <div className="min-h-screen">
          <header className="sticky top-0 z-20 bg-white border-b border-[#E5DDD3] px-4 sm:px-8 py-4 flex flex-wrap items-center justify-between gap-4">
            <div><p className="text-[10px] uppercase tracking-widest text-[#6B625A] font-bold">NGO Platform</p><h1 className="heading text-xl font-semibold">Project Workspace</h1></div>
            <nav className="flex flex-wrap gap-1 rounded-xl bg-[#FFF9F2] p-1" aria-label="Main navigation">{['dashboard','projects','tasks','analytics','reports'].map(t=><button key={t} onClick={()=>setTab(t)} className={"capitalize px-3 sm:px-4 py-2 rounded-lg text-sm "+(tab===t?'bg-[#F47B20] text-white':'hover:bg-white')}>{t}</button>)}</nav>
            <div className="flex gap-2"><span className="hidden sm:inline self-center text-xs text-[#6B625A]">{roleInfo[role].name}</span><button className={secondary} onClick={signOut}>Sign out</button></div>
          </header>
          <main className="max-w-7xl mx-auto p-4 sm:p-8 fade">
            {tab==='dashboard' && <div className="space-y-8">
              <div className="flex flex-wrap items-end justify-between gap-4 border-b border-[#E5DDD3] pb-5"><div><h2 className="heading text-3xl font-semibold">{roleInfo[role].name} Overview</h2><p className="text-sm text-[#6B625A] mt-1">{roleInfo[role].subtitle}</p></div><button className={primary} onClick={()=>setModal(role==='coordinator'?'update':'task')}>{roleInfo[role].action}</button></div>
              <section className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
                {[['Active Projects',activeProjects],['Tasks Completed',`${completed}/${tasks.length}`],['Portfolio Budget',money(projects.reduce((s,p)=>s+p.budget,0))],['Community Reach','18.4k']].map(([label,value])=><article key={label} className="bg-white p-6 rounded-2xl border border-[#E5DDD3] shadow-sm"><p className="text-sm text-[#6B625A]">{label}</p><p className="text-3xl font-bold mt-3">{value}</p><p className="text-xs text-[#F47B20] mt-2">Workspace metric</p></article>)}
              </section>
              <section className="bg-white rounded-2xl border border-[#E5DDD3] p-5 sm:p-7"><div className="flex flex-wrap justify-between gap-2 mb-5"><div><h3 className="heading text-2xl font-semibold">Project Pulse</h3><p className="text-sm text-[#6B625A]">Adjust progress using the slider.</p></div><button className={secondary} onClick={()=>setTab('projects')}>All projects →</button></div>
                <div className="space-y-6">{projects.map(p=><div key={p.id}><div className="flex flex-wrap justify-between gap-2"><div><h4 className="font-semibold">{p.title}</h4><p className="text-xs text-[#6B625A] mt-1">{p.location} · Lead: {p.lead}</p></div><span className="font-bold">{p.progress}%</span></div><input aria-label={p.title+' progress'} className="w-full mt-3 accent-orange-500" type="range" min="0" max="100" value={p.progress} onChange={e=>updateProgress(p.id,e.target.value)}/><div className="flex justify-between text-xs text-[#6B625A]"><span>{p.nextMilestone}</span><span>{money(p.spent)} / {money(p.budget)}</span></div></div>)}</div>
              </section>
              <section className="bg-white rounded-2xl border border-[#E5DDD3] p-5 sm:p-7"><div className="flex justify-between items-center gap-3 mb-4"><div><h3 className="heading text-2xl font-semibold">Recent Field Updates</h3><p className="text-sm text-[#6B625A]">Latest field notes</p></div><button className={primary} onClick={()=>setModal('update')}>+ Add update</button></div>{updates.length===0?<p className="text-sm text-[#6B625A]">No updates yet.</p>:<div className="space-y-3">{updates.map(u=><article key={u.id} className="rounded-xl bg-[#FFF9F2] border border-[#E5DDD3] p-4"><div className="flex flex-wrap justify-between gap-2 text-sm"><strong>{u.author}</strong><span className="text-xs text-[#6B625A]">{u.timestamp}</span></div><p className="text-sm mt-2">{u.text}</p><p className="text-xs text-[#6B625A] mt-2">{u.location} · {u.badge}</p></article>)}</div>}</section>
            </div>}
            {tab==='projects' && <section><div className="flex flex-wrap justify-between items-end gap-3 mb-6"><div><h2 className="heading text-3xl font-semibold">Projects Directory</h2><p className="text-sm text-[#6B625A] mt-1">Budgets, progress, and delivery milestones.</p></div><button className={primary} onClick={()=>setModal('task')}>+ Create task</button></div><div className="grid md:grid-cols-2 xl:grid-cols-3 gap-5">{projects.map(p=><article key={p.id} className="bg-white rounded-2xl border border-[#E5DDD3] p-6 flex flex-col"><div className="flex justify-between gap-3"><span className="text-xs rounded-full px-3 py-1 bg-[#FFF1E5] text-[#B94E08]">{p.category}</span><span className="text-xs font-semibold">{p.status}</span></div><h3 className="heading text-xl font-semibold mt-4">{p.title}</h3><p className="text-sm text-[#6B625A] mt-2 flex-1">{p.description}</p><p className="text-xs text-[#6B625A] mt-4">{p.location} · Lead: {p.lead}</p><div className="flex justify-between text-sm mt-5"><strong>{p.progress}% complete</strong><span>{money(p.spent)} / {money(p.budget)}</span></div><input aria-label={p.title+' progress'} type="range" min="0" max="100" value={p.progress} onChange={e=>updateProgress(p.id,e.target.value)} className="w-full accent-orange-500 mt-2"/><p className="text-xs text-[#6B625A] mt-3">{p.beneficiaries}</p></article>)}</div></section>}
            {tab==='tasks' && <section><div className="flex flex-wrap justify-between items-end gap-3 mb-6"><div><h2 className="heading text-3xl font-semibold">Task Checklist</h2><p className="text-sm text-[#6B625A] mt-1">Mark tasks complete or reopen them.</p></div><div className="flex gap-2"><button className={secondary} onClick={()=>setModal('update')}>Field update</button><button className={primary} onClick={()=>setModal('task')}>+ Add task</button></div></div><div className="flex flex-wrap gap-2 mb-4">{['all','in-progress','review','completed'].map(s=><button key={s} onClick={()=>setFilter(s)} className={"rounded-lg px-3 py-2 text-xs font-semibold "+(filter===s?'bg-[#292524] text-white':'bg-white border border-[#E5DDD3]')}>{s==='all'?'All tasks':s.replace('-',' ')} ({s==='all'?tasks.length:tasks.filter(t=>t.status===s).length})</button>)}</div><div className="bg-white rounded-2xl border border-[#E5DDD3] divide-y divide-[#E5DDD3]">{filteredTasks.length===0?<p className="p-6 text-sm text-[#6B625A]">No tasks in this category.</p>:filteredTasks.map(t=><article key={t.id} className="p-4 sm:p-5 flex items-start gap-3"><input type="checkbox" aria-label={'Complete '+t.title} checked={t.status==='completed'} onChange={()=>toggleTask(t.id)} className="mt-1 h-5 w-5 accent-orange-500"/><div className="flex-1"><h3 className={"text-sm font-semibold "+(t.status==='completed'?'line-through text-[#6B625A]':'')}>{t.title}</h3><p className="text-xs text-[#6B625A] mt-2">{t.project} · {t.assignee} ({t.role}) · Due {t.dueDate}</p></div><span className="text-xs font-semibold capitalize">{t.status.replace('-',' ')}</span></article>)}</div></section>}
            {tab==='analytics' && <section><h2 className="heading text-3xl font-semibold">Portfolio Impact Analytics</h2><p className="text-sm text-[#6B625A] mt-1 mb-6">Summary based on the current demonstration project data.</p><div className="grid md:grid-cols-3 gap-5">{[['Fund allocation',projects.map(p=>({name:p.title,value:p.budget}))],['Delivery progress',projects.map(p=>({name:p.title,value:p.progress}))],['Beneficiary reach',[{name:'Water',value:6200},{name:'Education',value:4800},{name:'Health',value:7400}]]].map(([title,items])=><article key={title} className="bg-white rounded-2xl border border-[#E5DDD3] p-6"><h3 className="heading text-xl font-semibold mb-4">{title}</h3>{items.map(item=>{const max=Math.max(...items.map(x=>x.value),1);return <div key={item.name} className="mb-4"><div className="flex justify-between gap-2 text-xs mb-1"><span>{item.name}</span><strong>{title==='Delivery progress'?item.value+'%':item.value.toLocaleString('en-IN')}</strong></div><div className="h-2 bg-[#F8F0E7] rounded-full overflow-hidden"><div className="h-full bg-[#F47B20]" style={{width:(item.value/max*100)+'%'}}/></div></div>})}</article>)}</div></section>}
            {tab==='reports' && <section><h2 className="heading text-3xl font-semibold">Governance & Donor Reports</h2><p className="text-sm text-[#6B625A] mt-1 mb-6">Demonstration report actions.</p><div className="bg-white rounded-2xl border border-[#E5DDD3] divide-y divide-[#E5DDD3]">{['Q3 2026 Statutory Compliance & Fund Audit','Rajasthan Clean Water Initiative: Mid-Term Evaluation'].map(r=><div key={r} className="p-5 flex flex-wrap justify-between items-center gap-3"><div><h3 className="font-semibold text-sm">{r}</h3><p className="text-xs text-[#6B625A] mt-1">Sample report entry · Demo only</p></div><button className={secondary} onClick={()=>notify('This demo does not generate actual report files.')}>Export</button></div>)}</div></section>}
          </main>
          <footer className="border-t border-[#E5DDD3] bg-white px-4 sm:px-8 py-4 flex justify-between gap-3 text-xs text-[#6B625A]"><span className="font-semibold uppercase">{roleInfo[role].name}</span><span>NGO Project Management Platform · Demo</span></footer>
        </div>}
        {modal && <div className="fixed inset-0 z-50 bg-black/50 p-4 flex items-center justify-center" onMouseDown={e=>{if(e.target===e.currentTarget)setModal('')}}>
          <section role="dialog" aria-modal="true" className="bg-white w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl shadow-xl p-6">
            <div className="flex justify-between items-center border-b border-[#E5DDD3] pb-3 mb-4"><h2 className="heading text-xl font-semibold">{modal==='task'?'Create New Task':modal==='update'?'Submit Field Update':modal==='forgot'?'Password Recovery':'Help & Support'}</h2><button aria-label="Close dialog" className="text-xl px-2" onClick={()=>setModal('')}>×</button></div>
            {modal==='task' && <form onSubmit={submitTask} className="space-y-4 text-sm">
              <label className="block">Task title<input name="title" required className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3" placeholder="Describe the task"/></label>
              <label className="block">Project<select name="project" className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3">{projects.map(p=><option key={p.id}>{p.title}</option>)}</select></label>
              <div className="grid sm:grid-cols-2 gap-3"><label className="block">Assignee<input name="assignee" required className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3" placeholder="Name"/></label><label className="block">Assignee role<select name="assigneeRole" className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3"><option>Coordinator</option><option>Project Manager</option><option>Admin</option></select></label></div>
              <div className="grid sm:grid-cols-2 gap-3"><label className="block">Priority<select name="priority" className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3"><option>Normal</option><option>Medium</option><option>High</option></select></label><label className="block">Due date<input name="dueDate" type="date" required className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3"/></label></div>
              <div className="flex justify-end gap-2"><button type="button" className={secondary} onClick={()=>setModal('')}>Cancel</button><button className={primary}>Create task</button></div>
            </form>}
            {modal==='update' && <form onSubmit={submitUpdate} className="space-y-4 text-sm">
              <label className="block">Author<input name="author" required defaultValue={roleInfo[role].name} className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3"/></label>
              <label className="block">Field location<input name="location" required className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3" placeholder="Village / field site"/></label>
              <label className="block">Progress notes<textarea name="notes" required rows="4" className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3" placeholder="Describe observations and progress"/></label>
              <label className="block">Beneficiary tag (optional)<input name="badge" className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3" placeholder="e.g. 64 families verified"/></label>
              <div className="flex justify-end gap-2"><button type="button" className={secondary} onClick={()=>setModal('')}>Cancel</button><button className={primary}>Publish update</button></div>
            </form>}
            {modal==='help' && <div className="text-sm space-y-3"><p>This is a front-end demonstration. Choose a workspace role after sign-in to explore projects, tasks, analytics, and field updates.</p><button className={primary} onClick={()=>setModal('')}>Close</button></div>}
            {modal==='forgot' && <form onSubmit={e=>{e.preventDefault();setModal('');notify('Password recovery is not connected in this demo.')}} className="space-y-4 text-sm"><p>Password recovery is not connected to a server in this demo.</p><label className="block">Organization email<input type="email" required className="mt-1 w-full border border-[#E5DDD3] rounded-lg p-3" placeholder="you@organization.org"/></label><div className="flex justify-end gap-2"><button type="button" className={secondary} onClick={()=>setModal('')}>Cancel</button><button className={primary}>Continue</button></div></form>}
          </section>
        </div>}
        {toast && <div role="status" aria-live="polite" className="fixed bottom-5 right-5 z-[60] bg-[#292524] text-white rounded-xl px-4 py-3 text-sm shadow-xl">{toast}</div>}
      </div>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
