            const isCompleted = clamped === 100;
            triggerToast(`${p.title} delivery updated to ${clamped}%`);
            return {

              progress: clamped,
              status: isCompleted ? 'Completed' : 'Active'
            };

                      <label className="block font-medium text-[#6B625A] mb-1">Target Due Date:</label>
                      <input type="text" name="dueDate" required defaultValue="Nov 10, 2026" className="w-full px-3 py-2 bg-[#F8F6F2] border border-[#E5DDD3] rounded-xl text-[#292524]" />
                    </div>
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 border border-[#E5DDD3] rounded-xl text-[#6B625A] cursor-pointer">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-[#F47B20] text-white font-medium rounded-xl hover:bg-[#DE6C15] cursor-pointer">Create Task</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-14 sm:bottom-6 right-6 z-50 bg-[#292524] text-[#FFF9F2] px-4 py-3 rounded-xl shadow-xl border border-[#F9B233] text-xs flex items-center gap-2 animate-fade-in">
              <span className="text-[#F47B20]"><Icons.Check /></span>
              <span>{toast}</span>
            </div>
          )}

          {/* Dev navigator removed — Sign Out via sidebar returns to login */}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MainApp />);
  </script>
</body>
</html>
