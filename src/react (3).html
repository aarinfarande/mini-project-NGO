<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGO Project Management Platform (React 18 Engine)</title>
  
  <!-- Google Fonts: Gelasio & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            saffron: '#F47B20',
            golden: '#F9B233',
            charcoal: '#292524',
            cream: '#FFF9F2',
            white: '#FFFFFF',
            muted: '#6B625A',
          },
          fontFamily: {
            heading: ['Gelasio', 'Georgia', 'serif'],
            body: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- React 18 and Babel Standalone for in-browser JSX support -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#FFF9F2] text-[#292524] min-h-screen font-body antialiased selection:bg-[#F9B233] selection:text-[#292524]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Icons
    const Icons = {
      ChevronRight: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>,
      ArrowLeft: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,
      Check: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
      Shield: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>,
      FolderKanban: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M8 10v4"/><path d="M12 10v2"/><path d="M16 10v6"/></svg>,
      ListTodo: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>,
      LayoutGrid: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>,
      TrendingUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>,
      FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>,
      Folder: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>,
      ListChecks: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>,
      IndianRupee: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3"/><path d="M9 13c6.667 0 6.667-10 0-10"/></svg>,
      Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
      Plus: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
      MapPin: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>,
      Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    };

    function StandaloneReactApp() {
      const [screen, setScreen] = useState('login');
      const [role, setRole] = useState('admin');
      const [tab, setTab] = useState('dashboard');
      const [tasks, setTasks] = useState([
        { id: 't1', title: 'Commission solar filtration pump at Hamlet 4', project: 'Clean Water Initiative', assignee: 'Suresh Kumar', status: 'completed' },
        { id: 't2', title: 'Deliver 15 STEM learning kits to Model Upper Primary School', project: 'Schools for all', assignee: 'Meena Solanki', status: 'completed' },
        { id: 't3', title: 'Collect water quality test samples post-monsoon', project: 'Clean Water Initiative', assignee: 'Anita Roy', status: 'completed' },
        { id: 't4', title: 'Publish Phase 1 telemedicine diagnostic report', project: 'Mobile Health Clinic', assignee: 'Dr. Kavita Rao', status: 'completed' },
        { id: 't5', title: 'Distribute sanitary napkin hygiene kits in Zone 2', project: 'Mobile Health Clinic', assignee: 'Pooja Patil', status: 'completed' },
        { id: 't6', title: 'Conduct community water management audit', project: 'Clean Water Initiative', assignee: 'Suresh Kumar', status: 'completed' },
        { id: 't7', title: 'Inspect pipeline laying in Jaisalmer cluster 3', project: 'Clean Water Initiative', assignee: 'Anita Roy', status: 'in-progress' },
        { id: 't8', title: 'Conduct parent-teacher digital awareness session', project: 'Schools for all', assignee: 'Rahul Verma', status: 'in-progress' },
      ]);

      const toggleTask = (id) => {
        setTasks(prev => prev.map(t => t.id === id ? { ...t, status: t.status === 'completed' ? 'in-progress' : 'completed' } : t));
      };

      const completedCount = tasks.filter(t => t.status === 'completed').length;

      return (
        <div className="min-h-screen bg-[#FFF9F2] text-[#292524] font-body">
          {screen === 'login' && (
            <div className="min-h-screen bg-[#FFF9F2] flex items-center justify-center p-4">
              <div className="w-full max-w-5xl bg-white rounded-3xl shadow-2xl border border-[#F9B233]/40 overflow-hidden flex flex-col md:flex-row min-h-[640px]">
                <div className="w-full md:w-[60%] p-8 sm:p-14 flex flex-col justify-between">
                  <div>
                    <span className="text-xs uppercase tracking-widest text-[#6B625A] font-semibold">NGO Management Workspace</span>
                    <h1 className="text-4xl sm:text-5xl font-heading font-semibold text-[#292524] mt-2 mb-2">Namaste</h1>
                    <p className="text-sm text-[#6B625A] mb-8">Sign in with your organizational credentials to continue.</p>
                    
                    <form onSubmit={(e) => { e.preventDefault(); setScreen('select-role'); }} className="space-y-4">
                      <div>
                        <label className="block text-sm font-medium text-[#6B625A] mb-1">Login:</label>
                        <input defaultValue="admin@grassroots.ngo" className="w-full px-4 py-3 bg-[#F8F6F2] border border-[#E5DDD3] rounded-xl text-sm" />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-[#6B625A] mb-1">Password:</label>
                        <input type="password" defaultValue="••••••••" className="w-full px-4 py-3 bg-[#F8F6F2] border border-[#E5DDD3] rounded-xl text-sm" />
                      </div>
                      <div className="flex justify-between text-xs text-[#6B625A] pt-1">
                        <button type="button" onClick={() => alert('Support Helpline: 1800-419-8800')} className="hover:underline">Help?</button>
                        <button type="button" onClick={() => alert('Recovery email sent.')} className="hover:underline">Forgot Password?</button>
                      </div>
                      <button type="submit" className="w-full py-3.5 bg-[#F47B20] hover:bg-[#DE6C15] text-white font-medium rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                        <span>Sign In</span>
                        <Icons.ChevronRight />
                      </button>
                    </form>
                  </div>
                  <div className="pt-6 border-t border-[#E5DDD3]">
                    <span className="text-xs text-[#6B625A] font-semibold uppercase block mb-2">Quick Demo Login:</span>
                    <div className="grid grid-cols-3 gap-2 text-xs">
                      <button onClick={() => { setRole('admin'); setScreen('dashboard'); }} className="p-2 border rounded-lg bg-[#FFF9F2] font-medium">Admin</button>
                      <button onClick={() => { setRole('pm'); setScreen('dashboard'); }} className="p-2 border border-[#F47B20] text-[#F47B20] rounded-lg bg-[#FFF9F2] font-medium">PM</button>
                      <button onClick={() => { setRole('coordinator'); setScreen('dashboard'); }} className="p-2 border border-[#F9B233] rounded-lg bg-[#FFF9F2] font-medium">Coordinator</button>
                    </div>
                  </div>
                </div>

                <div className="w-full md:w-[40%] bg-[#F9B233] p-8 sm:p-12 text-white flex flex-col justify-between">
                  <div>
                    <span className="px-3 py-1 bg-white/20 rounded-full text-xs font-semibold uppercase">Field & Portfolio Engine</span>
                    <h2 className="text-3xl font-heading font-semibold mt-4 mb-3">Turn grassroot effort into measurable change.</h2>
                    <p className="text-sm text-white/90 leading-relaxed font-body">A unified system linking village field workers, regional project leads, and executive oversight.</p>
                  </div>
                  <div className="pt-4 border-t border-white/25 flex justify-between items-center text-xs">
                    <span>NGO Suite v2.4</span>
                    <button type="button" onClick={() => setScreen('login')} className="flex items-center gap-1 font-medium hover:text-[#292524]">
                      <span>Back</span>
                      <Icons.ArrowLeft />
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {screen === 'select-role' && (
            <div className="min-h-screen bg-[#FFF9F2] flex items-center justify-center p-4">
              <div className="w-full max-w-5xl bg-white rounded-3xl shadow-2xl border border-[#F9B233]/40 overflow-hidden flex flex-col md:flex-row min-h-[640px]">
                <div className="w-full md:w-[60%] p-8 sm:p-14 flex flex-col justify-between">
                  <div>
                    <span className="text-xs uppercase tracking-widest text-[#6B625A] font-semibold">WELCOME BACK</span>
                    <h1 className="text-3xl sm:text-4xl font-heading font-semibold text-[#292524] mt-1 mb-1">Choose your workspace</h1>
                    <p className="text-sm text-[#6B625A] mb-8">Select your profile to customize dashboard tools.</p>
                    <div className="space-y-4">
                      <button onClick={() => { setRole('admin'); setScreen('dashboard'); }} className="w-full text-left p-4 rounded-2xl border-2 border-[#E5DDD3] hover:border-[#F47B20] flex justify-between items-center group">
                        <div className="flex items-center gap-3">
                          <span className="w-10 h-10 rounded-xl bg-[#292524] text-white flex items-center justify-center"><Icons.Shield /></span>
                          <div>
                            <div className="flex items-center gap-2">
                              <h3 className="font-heading font-semibold text-[#292524]">Admin</h3>
                              <span className="text-[10px] px-2 py-0.5 rounded bg-[#292524] text-white">Full Access</span>
                            </div>
                            <p className="text-xs text-[#6B625A]">Portfolio budget overview (₹1080k), all pulse indicators.</p>
                          </div>
                        </div>
                        <Icons.ChevronRight />
                      </button>

                      <button onClick={() => { setRole('pm'); setScreen('dashboard'); }} className="w-full text-left p-4 rounded-2xl border-2 border-[#E5DDD3] hover:border-[#F47B20] flex justify-between items-center group">
                        <div className="flex items-center gap-3">
                          <span className="w-10 h-10 rounded-xl bg-[#F47B20] text-white flex items-center justify-center"><Icons.FolderKanban /></span>
                          <div>
                            <div className="flex items-center gap-2">
                              <h3 className="font-heading font-semibold text-[#292524]">Project Manager</h3>
                              <span className="text-[10px] px-2 py-0.5 rounded bg-[#F47B20] text-white">Project Scope</span>
                            </div>
                            <p className="text-xs text-[#6B625A]">Manage assigned projects, budget tracking (₹420k).</p>
                          </div>
                        </div>
                        <Icons.ChevronRight />
                      </button>

                      <button onClick={() => { setRole('coordinator'); setScreen('dashboard'); }} className="w-full text-left p-4 rounded-2xl border-2 border-[#E5DDD3] hover:border-[#F47B20] flex justify-between items-center group">
                        <div className="flex items-center gap-3">
                          <span className="w-10 h-10 rounded-xl bg-[#F9B233] text-[#292524] flex items-center justify-center"><Icons.ListTodo /></span>
                          <div>
                            <div className="flex items-center gap-2">
                              <h3 className="font-heading font-semibold text-[#292524]">Coordinator</h3>
                              <span className="text-[10px] px-2 py-0.5 rounded bg-[#F9B233] text-[#292524]">Field Operations</span>
                            </div>
                            <p className="text-xs text-[#6B625A]">Focused task checklist, field updates submission.</p>
                          </div>
                        </div>
                        <Icons.ChevronRight />
                      </button>
                    </div>
                  </div>
                  <div className="pt-6 border-t border-[#E5DDD3] flex justify-between text-xs text-[#6B625A]">
                    <span>Need access? Contact admin</span>
                    <button onClick={() => setScreen('login')} className="flex items-center gap-1 font-medium hover:text-[#292524]">
                      <Icons.ArrowLeft /> Back to Login
                    </button>
                  </div>
                </div>

                <div className="w-full md:w-[40%] bg-[#F9B233] p-8 sm:p-12 text-white flex flex-col justify-between">
                  <div>
                    <span className="px-3 py-1 bg-white/20 rounded-full text-xs font-semibold uppercase">Our Shared Mission</span>
                    <h2 className="text-3xl font-heading font-semibold mt-4 mb-3">"Make every effort count."</h2>
                    <p className="text-base text-white/95 leading-relaxed font-body">A clear, shared workspace for the people turning good intentions into measurable change.</p>
                  </div>
                  <div className="pt-4 border-t border-white/25 flex justify-between items-center text-xs">
                    <span>18,400+ Lives Impacted</span>
                    <button onClick={() => setScreen('login')} className="flex items-center gap-1 font-medium hover:text-[#292524]">
                      <span>Back</span>
                      <Icons.ArrowLeft />
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {screen === 'dashboard' && (
            <div className="outer-golden-frame">
              <div className="inner-white-viewport">
                <header className="border-b border-[#E5DDD3] px-6 py-4 flex justify-between items-center bg-white sticky top-0 z-30">
                  <div>
                    <span className="text-[10px] font-semibold uppercase text-[#6B625A]">NGO Platform</span>
                    <h2 className="text-xl font-heading font-semibold text-[#292524]">Project Workspace</h2>
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="px-3 py-1 rounded-full text-xs font-semibold uppercase bg-[#292524] text-white">
                      {role.toUpperCase()}
                    </span>
                    <button onClick={() => setScreen('select-role')} className="px-3 py-1 text-xs border rounded-lg hover:bg-[#FFF9F2]">
                      Switch Profile
                    </button>
                  </div>
                </header>

                <div className="p-6 space-y-6">
                  {/* KPI Cards */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-white p-5 rounded-2xl border border-[#E5DDD3] shadow-sm">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-sm font-heading font-medium text-[#6B625A]">Active Projects</span>
                        <span className="text-[#F47B20]"><Icons.Folder /></span>
                      </div>
                      <span className="text-3xl font-bold font-body text-[#292524]">{role === 'coordinator' ? '1' : role === 'pm' ? '2' : '3'}</span>
                      <span className="text-xs text-[#F47B20] block mt-1 font-semibold">Under Delivery</span>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-[#E5DDD3] shadow-sm">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-sm font-heading font-medium text-[#6B625A]">Tasks Completed</span>
                        <span className="text-[#F9B233]"><Icons.ListChecks /></span>
                      </div>
                      <span className="text-3xl font-bold font-body text-[#292524]">{completedCount}/18</span>
                      <span className="text-xs text-[#F9B233] block mt-1 font-semibold">Milestones Met</span>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-[#E5DDD3] shadow-sm">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-sm font-heading font-medium text-[#6B625A]">Portfolio Budget</span>
                        <span className="text-[#292524]"><Icons.IndianRupee /></span>
                      </div>
                      <span className="text-3xl font-bold font-body text-[#292524]">{role === 'coordinator' ? '₹85k' : role === 'pm' ? '₹420k' : '₹1080k'}</span>
                      <span className="text-xs text-[#292524] block mt-1 font-semibold">INR Allocated</span>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border border-[#E5DDD3] shadow-sm">
                      <div className="flex justify-between items-center mb-2">
                        <span className="text-sm font-heading font-medium text-[#6B625A]">People Reached</span>
                        <span className="text-[#F47B20]"><Icons.Users /></span>
                      </div>
                      <span className="text-3xl font-bold font-body text-[#292524]">{role === 'coordinator' ? '3.4k' : role === 'pm' ? '8.2k' : '18.4k'}</span>
                      <span className="text-xs text-[#F47B20] block mt-1 font-semibold">Direct Beneficiaries</span>
                    </div>
                  </div>

                  {/* Project Pulse Section */}
                  <div className="bg-[#FFF9F2] p-6 rounded-2xl border border-[#E5DDD3] space-y-4">
                    <h3 className="text-xl font-heading font-semibold text-[#292524]">Project Pulse</h3>
                    <p className="text-xs text-[#6B625A]">Current delivery metric</p>
                    
                    <div className="bg-white p-4 rounded-xl border border-[#E5DDD3] space-y-2">
                      <div className="flex justify-between text-sm font-semibold">
                        <span>Clean Water Initiative</span>
                        <span className="text-[#F47B20]">65%</span>
                      </div>
                      <div className="w-full bg-[#FFF9F2] h-3 rounded-full overflow-hidden border">
                        <div className="bg-[#F47B20] h-full" style={{ width: '65%' }}></div>
                      </div>
                    </div>

                    <div className="bg-white p-4 rounded-xl border border-[#E5DDD3] space-y-2">
                      <div className="flex justify-between text-sm font-semibold">
                        <span>Schools for all</span>
                        <span className="text-[#F9B233]">40%</span>
                      </div>
                      <div className="w-full bg-[#FFF9F2] h-3 rounded-full overflow-hidden border">
                        <div className="bg-[#F9B233] h-full" style={{ width: '40%' }}></div>
                      </div>
                    </div>

                    <div className="bg-white p-4 rounded-xl border border-[#E5DDD3] space-y-2">
                      <div className="flex justify-between text-sm font-semibold">
                        <span>Mobile Health Clinic</span>
                        <span className="text-[#F47B20]">100% Completed</span>
                      </div>
                      <div className="w-full bg-[#FFF9F2] h-3 rounded-full overflow-hidden border">
                        <div className="bg-[#F47B20] h-full" style={{ width: '100%' }}></div>
                      </div>
                    </div>
                  </div>

                  {/* Tasks List */}
                  <div className="bg-white p-6 rounded-2xl border border-[#E5DDD3] space-y-3">
                    <h3 className="text-lg font-heading font-semibold text-[#292524]">Interactive Tasks (Click to toggle completion)</h3>
                    <div className="divide-y border rounded-xl overflow-hidden">
                      {tasks.map(t => (
                        <div key={t.id} onClick={() => toggleTask(t.id)} className="p-3.5 flex items-center justify-between hover:bg-[#FFF9F2] cursor-pointer">
                          <div className="flex items-center gap-3">
                            <span className={`w-5 h-5 rounded flex items-center justify-center border ${t.status === 'completed' ? 'bg-[#F47B20] border-[#F47B20] text-white' : 'border-[#E5DDD3]'}`}>
                              {t.status === 'completed' && <Icons.Check />}
                            </span>
                            <span className={`text-sm ${t.status === 'completed' ? 'line-through text-[#6B625A]' : 'text-[#292524] font-medium'}`}>{t.title}</span>
                          </div>
                          <span className={`text-xs px-2 py-0.5 rounded font-semibold ${t.status === 'completed' ? 'bg-[#292524] text-white' : 'bg-[#FFF9F2] text-[#F47B20]'}`}>{t.status}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Quick Navigator Bar */}
          <div className="fixed bottom-3 left-1/2 -translate-x-1/2 bg-white px-4 py-2 rounded-full border shadow-md flex gap-2 text-xs">
            <button onClick={() => setScreen('login')} className={`px-2.5 py-1 rounded-full ${screen === 'login' ? 'bg-[#F47B20] text-white' : ''}`}>1. Login</button>
            <button onClick={() => setScreen('select-role')} className={`px-2.5 py-1 rounded-full ${screen === 'select-role' ? 'bg-[#F47B20] text-white' : ''}`}>2. Select Role</button>
            <button onClick={() => setScreen('dashboard')} className={`px-2.5 py-1 rounded-full ${screen === 'dashboard' ? 'bg-[#F47B20] text-white' : ''}`}>3. Dashboard</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StandaloneReactApp />);
  </script>
</body>
</html>
